<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t">
  <title id="t">範例公園園區須知（範例圖）</title>
  <rect width="640" height="360" fill="#eef8f9"/>
  <rect x="24" y="24" width="592" height="312" rx="16" fill="#fff" stroke="#2eb6c7" stroke-width="4"/>
  <text x="320" y="84" font-family="sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#356c77">範例公園 園區須知</text>
  <line x1="64" y1="110" x2="576" y2="110" stroke="#c9e9ed" stroke-width="2"/>
  <g font-family="sans-serif" font-size="26" fill="#334155">
    <text x="72" y="162">1. 寵物須繫牽繩，並清理排泄物</text>
    <text x="72" y="212">2. 夜間照明至 23:00</text>
    <text x="72" y="262">3. 全天開放、免費入園</text>
  </g>
  <text x="320" y="312" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#94a3b8">此為框架示範用圖片，內容非真實資料</text>
</svg>
