name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.f.outputs.app }}
      web: ${{ steps.f.outputs.web }}
      backend: ${{ steps.f.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - id: f
        uses: dorny/paths-filter@v3
        with:
          filters: |
            app: ['lib/**', 'android/**', 'pubspec.*', 'assets/**']
            web: ['services/web/**']
            backend: ['services/backend/**']

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: services/web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build # vue-tsc type check + vite build

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/backend } }
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: townpass }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - name: tests (SQLite)
        run: uv run pytest -q
      - name: tests (Postgres, same as Render)
        run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/townpass

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.47.6, cache: true }
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      # upstream TownPass already has info/warning lints; only errors fail the build
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
